services:
  web:
    image: oven/bun:1
    working_dir: /app
    # Installs from the committed lockfile into a named volume, then runs the dev
    # server so every source edit hot-reloads without a rebuild.
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev"]
    environment:
      # Platform-provided preview flag (bare pass-through, never hardcoded).
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts so the preview host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - NODE_ENV=development
    volumes:
      - ./:/app
      - nestora_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    restart: on-failure
    labels:
      base44.project: "Nestora Homes"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  nestora_node_modules:
